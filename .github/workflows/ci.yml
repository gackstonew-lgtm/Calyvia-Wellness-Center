name: Calyvia CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calyvia_user
          POSTGRES_PASSWORD: calyvia_secure_pass
          POSTGRES_DB: calyvia_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Typecheck
        run: npm run build --if-present

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://calyvia_user:calyvia_secure_pass@localhost:5432/calyvia_test_db?schema=public"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: "ci_jwt_access_secret_test_key_12345"
          JWT_REFRESH_SECRET: "ci_jwt_refresh_secret_test_key_12345"
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: npm run test --if-present
