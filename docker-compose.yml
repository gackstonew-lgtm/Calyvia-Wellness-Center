version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: calyvia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: calyvia_user
      POSTGRES_PASSWORD: calyvia_secure_pass
      POSTGRES_DB: calyvia_db
      TZ: Africa/Nairobi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calyvia_user -d calyvia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: calyvia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: calyvia_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: calyvia_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://calyvia_user:calyvia_secure_pass@postgres:5432/calyvia_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "calyvia_jwt_access_super_secret_development_key_2026_xyz"
      JWT_REFRESH_SECRET: "calyvia_jwt_refresh_super_secret_development_key_2026_xyz"
      ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      TZ: Africa/Nairobi
    ports:
      - "4000:4000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: calyvia_admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
